# Shared App Hosting deploy steps. Caller must:
#   - checkout first (local composite)
#   - set job `environment:` to a string literal (`staging` / `production`)
#   - pass FIREBASE_SERVICE_ACCOUNT via env (Environment secret JSON)
#   - set FIREBASE_PROJECT and APPHOSTING_ENV on the job
name: Deploy App Hosting
description: Install, render apphosting.yaml, ADC from FIREBASE_SERVICE_ACCOUNT, firebase deploy

runs:
  using: composite
  steps:
    - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
      with:
        node-version: 22
        cache: npm
        cache-dependency-path: package-lock.json

    - name: Install dependencies
      shell: bash
      run: npm ci

    - name: Self-checks
      shell: bash
      run: |
        npm run check:env
        npm run check:apphosting
        npm run check:nia-downloads

    - name: Render apphosting.yaml
      shell: bash
      env:
        NEXT_PUBLIC_SITE_URL: ${{ vars.NEXT_PUBLIC_SITE_URL }}
        NEXT_PUBLIC_NIA_RELEASES_BASE: ${{ vars.NEXT_PUBLIC_NIA_RELEASES_BASE }}
        ALLOWED_ORIGINS: ${{ vars.ALLOWED_ORIGINS }}
        AGENT_URL: ${{ vars.AGENT_URL }}
        NEXT_PUBLIC_FIREBASE_API_KEY: ${{ vars.NEXT_PUBLIC_FIREBASE_API_KEY }}
        NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN: ${{ vars.NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN }}
        NEXT_PUBLIC_FIREBASE_PROJECT_ID: ${{ vars.NEXT_PUBLIC_FIREBASE_PROJECT_ID }}
        NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET: ${{ vars.NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET }}
        NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID: ${{ vars.NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID }}
        NEXT_PUBLIC_FIREBASE_APP_ID: ${{ vars.NEXT_PUBLIC_FIREBASE_APP_ID }}
        NEXT_PUBLIC_FIREBASE_DATABASE_URL: ${{ vars.NEXT_PUBLIC_FIREBASE_DATABASE_URL }}
        NEXT_PUBLIC_RAZORPAY_KEY_ID: ${{ vars.NEXT_PUBLIC_RAZORPAY_KEY_ID }}
        RAZORPAY_STARTER_PLAN_ID: ${{ vars.RAZORPAY_STARTER_PLAN_ID }}
        RAZORPAY_STARTER_ANNUAL_PLAN_ID: ${{ vars.RAZORPAY_STARTER_ANNUAL_PLAN_ID }}
        RAZORPAY_PRO_PLAN_ID: ${{ vars.RAZORPAY_PRO_PLAN_ID }}
        RAZORPAY_PRO_ANNUAL_PLAN_ID: ${{ vars.RAZORPAY_PRO_ANNUAL_PLAN_ID }}
        RAZORPAY_MAX_PLAN_ID: ${{ vars.RAZORPAY_MAX_PLAN_ID }}
        RAZORPAY_MAX_ANNUAL_PLAN_ID: ${{ vars.RAZORPAY_MAX_ANNUAL_PLAN_ID }}
        RAZORPAY_INR_STARTER_PLAN_ID: ${{ vars.RAZORPAY_INR_STARTER_PLAN_ID }}
        RAZORPAY_INR_STARTER_ANNUAL_PLAN_ID: ${{ vars.RAZORPAY_INR_STARTER_ANNUAL_PLAN_ID }}
        RAZORPAY_INR_PRO_PLAN_ID: ${{ vars.RAZORPAY_INR_PRO_PLAN_ID }}
        RAZORPAY_INR_PRO_ANNUAL_PLAN_ID: ${{ vars.RAZORPAY_INR_PRO_ANNUAL_PLAN_ID }}
        RAZORPAY_INR_MAX_PLAN_ID: ${{ vars.RAZORPAY_INR_MAX_PLAN_ID }}
        RAZORPAY_INR_MAX_ANNUAL_PLAN_ID: ${{ vars.RAZORPAY_INR_MAX_ANNUAL_PLAN_ID }}
      run: node scripts/render-apphosting.mjs --env "$APPHOSTING_ENV"

    # Do not use google-github-actions/auth `with: credentials_json`. An empty
    # or multiline SA JSON is treated as "input omitted", which is the WIF error.
    - name: Authenticate to Google Cloud
      shell: bash
      run: |
        set -euo pipefail
        if [ -z "${FIREBASE_SERVICE_ACCOUNT:-}" ]; then
          echo "::error::FIREBASE_SERVICE_ACCOUNT is empty on GitHub Environment '${APPHOSTING_ENV}'. Add the service-account JSON under Settings → Environments → ${APPHOSTING_ENV} → Environment secrets, name exactly FIREBASE_SERVICE_ACCOUNT."
          exit 1
        fi
        creds="${RUNNER_TEMP}/firebase-sa.json"
        printf '%s' "$FIREBASE_SERVICE_ACCOUNT" > "$creds"
        chmod 600 "$creds"
        if ! python3 -c 'import json,sys; json.load(open(sys.argv[1], encoding="utf-8"))' "$creds" 2>/dev/null; then
          echo "::error::FIREBASE_SERVICE_ACCOUNT is not valid JSON. Paste the raw key file (starts with {), not a path or base64."
          exit 1
        fi
        echo "GOOGLE_APPLICATION_CREDENTIALS=${creds}" >> "$GITHUB_ENV"
        echo "CLOUDSDK_AUTH_CREDENTIAL_FILE_OVERRIDE=${creds}" >> "$GITHUB_ENV"
        echo "CLOUDSDK_CORE_PROJECT=${FIREBASE_PROJECT}" >> "$GITHUB_ENV"
        echo "GOOGLE_CLOUD_PROJECT=${FIREBASE_PROJECT}" >> "$GITHUB_ENV"

    - name: Deploy App Hosting + rules
      shell: bash
      run: |
        set -euo pipefail
        npx firebase deploy \
          --only apphosting,firestore:rules,firestore:indexes,storage \
          --project "$FIREBASE_PROJECT" \
          --force \
          --non-interactive
