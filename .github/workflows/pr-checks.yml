# PR gate for staging. Does not deploy.
# deploy.yml stays the only App Hosting workflow (push to staging/production).

name: PR checks

on:
  pull_request:
    # Layer 1 billing timeline lives in test:ledger (db-tests); required on
    # every PR into staging and production (this repo's ship branch).
    branches: [staging, production]

permissions:
  contents: read
  actions: read

concurrency:
  group: pr-checks-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  # §14.4 — block PRs into production unless Layer 2 passed on that staging tip.
  l2-promotion-gate:
    name: Layer 2 promotion gate
    if: github.base_ref == 'production'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Require Layer 2 green on PR head (staging tip)
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          chmod +x scripts/require-l2-green.sh
          ./scripts/require-l2-green.sh "${{ github.event.pull_request.head.sha }}"

  drama-selfchecks:
    name: Drama selfchecks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
          cache: npm

      - run: npm ci
      - run: npm install --no-save tsx

      - name: Run drama selfchecks
        run: |
          set -euo pipefail
          required=(
            src/lib/fal/dramaGate.selfcheck.ts
            src/lib/fal/idempotency.selfcheck.ts
            src/lib/fal/capture.selfcheck.ts
            src/lib/fal/storageRules.selfcheck.ts
            src/lib/fal/falQueue.selfcheck.ts
            src/lib/fal/falSchema.selfcheck.ts
            src/lib/gateway/reserve.selfcheck.ts
            src/lib/billing/fxDrift.selfcheck.ts
            src/lib/billing/ledgerInvariant.selfcheck.ts
          )
          for f in "${required[@]}"; do
            if [[ ! -f "$f" ]]; then
              echo "missing required drama, billing, or rules check: $f" >&2
              exit 1
            fi
          done
          for f in src/lib/fal/*.selfcheck.ts \
                   src/lib/admin/rollup.selfcheck.ts \
                   src/lib/ops/alert.selfcheck.ts \
                   src/lib/gateway/reserve.selfcheck.ts \
                   src/lib/billing/fxDrift.selfcheck.ts \
                   src/lib/billing/ledgerInvariant.selfcheck.ts; do
            echo "==> $f"
            npx tsx "$f"
          done
          npm run check:fal-webhook

  db-tests:
    name: Supabase db tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
          cache: npm

      - run: npm ci

      - name: Start local Supabase + reset
        run: |
          set -euo pipefail
          npx supabase start
          npx supabase db reset

      - name: Types must match local schema
        run: |
          set -euo pipefail
          npm run db:types
          git diff --exit-code src/lib/db/types.gen.ts

      - name: pgTAP
        run: npm run db:test

      - name: Ledger race suite + billing timeline Layer 1
        # Picks up every *.ledgercheck.ts including billingTimelineLayer1.
        run: npm run test:ledger

  # Same typecheck next build runs in App Hosting Cloud Build.
  typecheck:
    name: Typecheck
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
          cache: npm

      - run: npm ci
      - run: npx next typegen
      - run: npx tsc --noEmit

  check-all:
    name: check:all
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
          cache: npm

      - run: npm ci
      - run: npm install --no-save tsx
      - run: npm run check:all
