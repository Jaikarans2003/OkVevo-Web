services:
  agent:
    platform: linux/arm64
    build:
      context: .
      dockerfile: services/agent/Dockerfile
      platforms:
        - linux/arm64
    ports:
      - "3001:3001"
    env_file:
      - services/agent/.env
    environment:
      # Override local-dev paths from .env for in-container binaries
      - DOCKER_AGENT=1
      - HYPERFRAMES_CLI=/usr/local/lib/node_modules/hyperframes/dist/cli.js
      - PORT=3001
    volumes:
      # Dev-only: SDK shared credentials. Production uses ECS task IAM role.
      - ${HOME}/.aws:/root/.aws:ro

  video-use:
    build:
      context: .
      dockerfile: services/video-use/docker/Dockerfile
    ports:
      - "3040:3040"
    env_file:
      - services/video-use/.env
    environment:
      - VIDEO_USE_REPO=/opt/video-use
      - VIDEO_USE_WORK_ROOT=/tmp/video-use/work
      - VIDEO_USE_TEMP_ROOT=/tmp/video-use/temp
      - PORT=3040
