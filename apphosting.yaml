# Settings for Backend okvevo-web (okvevo-testing).
# Public values only. Secrets are Secret Manager names — never commit values.
# SITE_URL / ALLOWED_ORIGINS: chicken-and-egg until the first backend exists.
# Expected origin: https://okvevo-web--okvevo-testing.us-central1.hosted.app
# Confirm with `firebase apphosting:backends:get okvevo-web --project okvevo-testing`
# and edit these two vars if the real URL differs. See hermes-agent/ENVIRONMENT.md.

runConfig:
  cpu: 1
  memoryMiB: 1024
  concurrency: 20
  minInstances: 0

env:
  - variable: OKVEVO_ENV
    value: staging
    availability:
      - BUILD
      - RUNTIME

  - variable: NEXT_PUBLIC_SITE_URL
    value: https://okvevo-web--okvevo-testing.us-central1.hosted.app
    availability:
      - BUILD
      - RUNTIME

  - variable: ALLOWED_ORIGINS
    value: https://okvevo-web--okvevo-testing.us-central1.hosted.app,http://localhost:3000,http://127.0.0.1:3000
    availability:
      - BUILD
      - RUNTIME

  - variable: AGENT_URL
    value: https://okvevo-web--okvevo-testing.us-central1.hosted.app
    availability:
      - BUILD
      - RUNTIME

  - variable: AWS_REGION
    value: us-central1
    availability:
      - BUILD
      - RUNTIME

  - variable: NEXT_PUBLIC_FIREBASE_API_KEY
    value: AIzaSyAPUH1rNbUu7Bxiul10rTx0mFH2XaH0N3Y
    availability:
      - BUILD
      - RUNTIME

  - variable: NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN
    value: okvevo-testing.firebaseapp.com
    availability:
      - BUILD
      - RUNTIME

  - variable: NEXT_PUBLIC_FIREBASE_PROJECT_ID
    value: okvevo-testing
    availability:
      - BUILD
      - RUNTIME

  - variable: NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET
