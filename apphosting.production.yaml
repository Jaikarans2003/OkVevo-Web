# Production App Hosting config for backend okvevo-web (Firebase project okvevo-prod).
# Public values only. Secrets are Secret Manager names — never commit values.
# CI copies this file to apphosting.yaml before `firebase deploy` (see .github/workflows/deploy.yml).
#
# CHANGE_ME values are fail-closed: render-apphosting.mjs refuses to deploy until
# GitHub Environment variables (or this file) supply live Firebase web keys and
# Razorpay live plan ids. Do not ship test keys to production.
#
# Custom domain: https://www.okvevo.com on the production App Hosting backend.
# See docs/CI-CD.md.

runConfig:
  cpu: 1
  memoryMiB: 1024
  concurrency: 20
  minInstances: 0

env:
  - variable: OKVEVO_ENV
    value: production
    availability:
      - BUILD
      - RUNTIME

  - variable: NEXT_PUBLIC_SITE_URL
    value: https://www.okvevo.com
    availability:
      - BUILD
      - RUNTIME

  - variable: NEXT_PUBLIC_NIA_RELEASES_BASE
    value: https://releases.okvevo.com
    availability:
      - BUILD
      - RUNTIME

  - variable: ALLOWED_ORIGINS
    value: https://www.okvevo.com,https://okvevo.com,http://localhost:3000,http://127.0.0.1:3000
    availability:
      - BUILD
      - RUNTIME

  - variable: AGENT_URL
    value: https://www.okvevo.com
    availability:
      - BUILD
      - RUNTIME

  - variable: AWS_REGION
    value: us-central1
    availability:
      - BUILD
      - RUNTIME

  - variable: NEXT_PUBLIC_FIREBASE_API_KEY
    value: CHANGE_ME
    availability:
      - BUILD
      - RUNTIME

  - variable: NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN
    value: okvevo-prod.firebaseapp.com
    availability:
      - BUILD
      - RUNTIME

  - variable: NEXT_PUBLIC_FIREBASE_PROJECT_ID
    value: okvevo-prod
    availability:
      - BUILD
      - RUNTIME

  - variable: NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET
    value: okvevo-prod.firebasestorage.app
    availability:
      - BUILD
      - RUNTIME

  - variable: NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID
    value: CHANGE_ME
    availability:
      - BUILD
      - RUNTIME

  - variable: NEXT_PUBLIC_FIREBASE_APP_ID
    value: CHANGE_ME
    availability:
      - BUILD
      - RUNTIME

  - variable: NEXT_PUBLIC_FIREBASE_DATABASE_URL
    value: https://okvevo-prod-default-rtdb.firebaseio.com
    availability:
      - BUILD
      - RUNTIME

  - variable: NEXT_PUBLIC_RAZORPAY_KEY_ID
    value: CHANGE_ME
    availability:
      - BUILD
      - RUNTIME

  - variable: RAZORPAY_STARTER_PLAN_ID
    value: CHANGE_ME
    availability:
      - BUILD
      - RUNTIME

  - variable: RAZORPAY_STARTER_ANNUAL_PLAN_ID
    value: CHANGE_ME
    availability:
      - BUILD
      - RUNTIME

  - variable: RAZORPAY_PRO_PLAN_ID
    value: CHANGE_ME
    availability:
      - BUILD
      - RUNTIME

  - variable: RAZORPAY_PRO_ANNUAL_PLAN_ID
    value: CHANGE_ME
    availability:
      - BUILD
      - RUNTIME

  - variable: RAZORPAY_MAX_PLAN_ID
    value: CHANGE_ME
    availability:
      - BUILD
      - RUNTIME

  - variable: RAZORPAY_MAX_ANNUAL_PLAN_ID
    value: CHANGE_ME
    availability:
      - BUILD
      - RUNTIME

  - variable: RAZORPAY_INR_STARTER_PLAN_ID
    value: CHANGE_ME
    availability:
      - BUILD
      - RUNTIME

  - variable: RAZORPAY_INR_STARTER_ANNUAL_PLAN_ID
    value: CHANGE_ME
    availability:
      - BUILD
      - RUNTIME

  - variable: RAZORPAY_INR_PRO_PLAN_ID
    value: CHANGE_ME
    availability:
      - BUILD
      - RUNTIME

  - variable: RAZORPAY_INR_PRO_ANNUAL_PLAN_ID
    value: CHANGE_ME
    availability:
      - BUILD
      - RUNTIME

  - variable: RAZORPAY_INR_MAX_PLAN_ID
    value: CHANGE_ME
    availability:
      - BUILD
      - RUNTIME

  - variable: RAZORPAY_INR_MAX_ANNUAL_PLAN_ID
    value: CHANGE_ME
    availability:
      - BUILD
      - RUNTIME

  - variable: ADMIN_EMAILS
    value: admin@okvevo.com
    availability:
      - RUNTIME

  - variable: OPENROUTER_API_KEY
    secret: OPENROUTER_API_KEY
    availability:
      - BUILD
      - RUNTIME

  - variable: FAL_KEY
    secret: FAL_KEY
    availability:
      - RUNTIME

  - variable: TAVILY_API_KEY
    secret: TAVILY_API_KEY
    availability:
      - RUNTIME

  - variable: FIREBASE_SERVICE_ACCOUNT_KEY
    secret: FIREBASE_SERVICE_ACCOUNT_KEY
    availability:
      - BUILD
      - RUNTIME

  - variable: RAZORPAY_KEY_ID
    secret: RAZORPAY_KEY_ID
    availability:
      - RUNTIME

  - variable: RAZORPAY_KEY_SECRET
    secret: RAZORPAY_KEY_SECRET
    availability:
      - RUNTIME

  - variable: RAZORPAY_WEBHOOK_SECRET
    secret: RAZORPAY_WEBHOOK_SECRET
    availability:
      - RUNTIME

  - variable: CRON_SECRET
    secret: CRON_SECRET
    availability:
      - RUNTIME
