# Production App Hosting config for backend okvevo-web (Firebase project text2video-16cbf).
# Public values only. Secrets are Secret Manager names — never commit values.
# CI copies this file to apphosting.yaml before `firebase deploy` (see .github/workflows/deploy.yml).
#
# Live Razorpay publishable key + plan IDs are set. Secrets stay in Secret Manager
# (see docs/CI-CD.md). Do not commit Key Secret / webhook secret here.
# Custom domain: https://www.okvevo.com on the production App Hosting backend.
# See docs/CI-CD.md.

runConfig:
  cpu: 1
  memoryMiB: 1024
  concurrency: 20
  minInstances: 0

env:
  - variable: OKVEVO_ENV
    value: production
    availability:
      - BUILD
      - RUNTIME

  - variable: NEXT_PUBLIC_SITE_URL
    value: https://www.okvevo.com
    availability:
      - BUILD
      - RUNTIME

  - variable: NEXT_PUBLIC_NIA_RELEASES_BASE
    value: https://releases.okvevo.com
    availability:
      - BUILD
      - RUNTIME

  - variable: ALLOWED_ORIGINS
    value: https://www.okvevo.com,https://okvevo.com,http://localhost:3000,http://127.0.0.1:3000
    availability:
      - BUILD
      - RUNTIME

  - variable: AGENT_URL
    value: https://www.okvevo.com
    availability:
      - BUILD
      - RUNTIME

  - variable: AWS_REGION
