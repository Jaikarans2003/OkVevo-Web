[project]
name = "okvevo-video-use"
version = "0.1.0"
description = "OKVEVO video-use HTTP worker (transcribe + render)"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "python-multipart>=0.0.18",
    # Service + upstream helpers (Refference/video-use/helpers/*)
    "requests>=2.32.0",
    "librosa>=0.10.0",
    "matplotlib>=3.8.0",
    "pillow>=10.0.0",
    "numpy>=1.26.0",
]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]
