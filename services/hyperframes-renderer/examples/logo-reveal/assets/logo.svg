<svg width="400" height="400" viewBox="0 0 400 400" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="grad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#FF6B6B;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#4ECDC4;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Hexagon background -->
  <polygon
    points="200,50 320,125 320,275 200,350 80,275 80,125"
    fill="url(#grad1)"
    opacity="0.2"
  />
  
  <!-- Main logo - stylized "H" -->
  <g fill="white">
    <!-- Left bar -->
    <rect x="120" y="120" width="40" height="160" rx="8" />
    
    <!-- Right bar -->
    <rect x="240" y="120" width="40" height="160" rx="8" />
    
    <!-- Cross bar -->
    <rect x="120" y="190" width="160" height="40" rx="8" />
    
    <!-- Play button triangle -->
    <polygon
      points="190,200 190,220 210,210"
      fill="#FF6B6B"
    />
  </g>
  
  <!-- Accent circle -->
  <circle cx="200" cy="200" r="180" fill="none" stroke="white" stroke-width="4" opacity="0.3" />
</svg>
