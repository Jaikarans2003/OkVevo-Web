<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <title>Logo Reveal with Asset</title>
    <script src="./assets/gsap.min.js"></script>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        width: 1920px;
        height: 1080px;
        overflow: hidden;
        background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        font-family: system-ui, -apple-system, sans-serif;
      }
      #root {
        position: relative;
        width: 100%;
        height: 100%;
      }
      .logo-container {
        position: absolute;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        text-align: center;
      }
      .logo-image {
        width: 400px;
        height: 400px;
        object-fit: contain;
        filter: drop-shadow(0 20px 40px rgba(0, 0, 0, 0.3));
      }
      .title {
        margin-top: 40px;
        font-size: 72px;
        font-weight: 800;
        letter-spacing: -0.02em;
        color: white;
        text-shadow: 0 4px 20px rgba(0, 0, 0, 0.25);
      }
      .subtitle {
        margin-top: 20px;
        font-size: 32px;
        font-weight: 400;
        color: rgba(255, 255, 255, 0.9);
      }
    </style>
  </head>
  <body>
    <div
      id="root"
      data-composition-id="logo-reveal"
      data-start="0"
      data-duration="3"
      data-width="1920"
      data-height="1080"
    >
      <div
        class="clip logo-container"
        data-composition-id="logo"
        data-start="0"
        data-duration="3"
        data-track-index="0"
        data-width="1920"
        data-height="1080"
      >
        <img
          class="logo-image"
          src="assets/logo.svg"
          alt="Logo"
        />
        <div class="title">HyperFrames</div>
        <div class="subtitle">HTML to Video</div>
      </div>
    </div>
    <script>
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });
      
      // Logo reveal animation
      tl.from(".logo-image", {
        scale: 0.3,
        opacity: 0,
        rotation: -180,
        duration: 0.8,
        ease: "back.out(1.7)",
      }, 0);
      
      tl.from(".title", {
        y: 30,
        opacity: 0,
        duration: 0.6,
        ease: "power2.out",
      }, 0.5);
      
      tl.from(".subtitle", {
        y: 20,
        opacity: 0,
        duration: 0.5,
        ease: "power2.out",
      }, 0.8);
      
      // Subtle float animation
      tl.to(".logo-image", {
        y: -10,
        duration: 1.2,
        ease: "sine.inOut",
        yoyo: true,
        repeat: 1,
      }, 1.2);
      
      window.__timelines["logo-reveal"] = tl;
    </script>
  </body>
</html>
