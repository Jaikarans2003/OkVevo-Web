<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <title>Simple solid — example</title>
    <script src="./assets/gsap.min.js"></script>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        width: 1080px;
        height: 1920px;
        overflow: hidden;
        background: #0f172a;
        color: #f8fafc;
        font-family: system-ui, sans-serif;
      }
    </style>
  </head>
  <body>
    <div
      id="root"
      data-composition-id="simple-solid"
      data-start="0"
      data-duration="2"
      data-width="1080"
      data-height="1920"
    >
      <div
        class="clip"
        data-composition-id="hero"
        data-start="0"
        data-duration="2"
        data-track-index="0"
        data-width="1080"
        data-height="1920"
        style="
          display: flex;
          align-items: center;
          justify-content: center;
          font-size: 96px;
          font-weight: 800;
          letter-spacing: -0.04em;
        "
      >
        HyperFrames
      </div>
    </div>
    <script>
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });
      tl.from(".clip", { opacity: 0, duration: 0.35, ease: "power2.out" }, 0);
      tl.to(".clip", { scale: 1.06, duration: 1.1, ease: "sine.inOut" }, 0.25);
      tl.to(".clip", { scale: 1, duration: 0.45, ease: "power2.inOut" }, 1.35);
      window.__timelines["simple-solid"] = tl;
    </script>
  </body>
</html>
