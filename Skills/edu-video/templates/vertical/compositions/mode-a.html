<template id="seg-mode-a-template">
  <div
    id="{{SEGMENT_ID}}"
    data-composition-id="{{SEGMENT_ID}}"
    data-start="0"
    data-width="1080"
    data-height="1920"
    data-duration="{{SEGMENT_DURATION}}"
  >
    <div id="brand-bg"></div>
    <div id="manim-float"></div>
    <div id="speaker-pip"></div>

    <style>
      {{BRAND_CSS_VARS}}

      #{{SEGMENT_ID}} {
        position: relative;
        width: 1080px;
        height: 1920px;
        overflow: hidden;
      }

      #{{SEGMENT_ID}} #brand-bg {
        position: absolute;
        inset: 0;
        z-index: 0;
        background: linear-gradient(
          135deg,
          var(--brand-bg-dark, #0a0a0a) 0%,
          var(--brand-primary, #f97316) 45%,
          var(--brand-secondary, var(--brand-primary, #f97316)) 100%
        );
      }

      /* Float marker — square top ~50% (matches root #manim-wrap) */
      #{{SEGMENT_ID}} #manim-float {
        position: absolute;
        top: 24px;
        left: 24px;
        width: 1032px;
        height: 1032px;
        max-height: calc(50% - 48px);
        border-radius: 24px;
        overflow: hidden;
        box-shadow:
          0 16px 48px rgba(0, 0, 0, 0.5),
          inset 0 1px 0 rgba(255, 255, 255, 0.15);
        border: 1px solid rgba(255, 255, 255, 0.2);
        z-index: 1;
        pointer-events: none;
      }

      /* Bottom speaker marker — plain rounded (no liquid-glass) */
      #{{SEGMENT_ID}} #speaker-pip {
        position: absolute;
        top: 1000px;
        left: 24px;
        width: 1032px;
        height: 896px;
        border-radius: 24px;
        overflow: hidden;
        z-index: -1;
        pointer-events: none;
        border: 1px solid rgba(255, 255, 255, 0.18);
        box-shadow:
          0 8px 32px rgba(0, 0, 0, 0.45),
          inset 0 1px 0 rgba(255, 255, 255, 0.15);
      }
    </style>

    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <script>
      (function () {
        const SEGMENT_DURATION = {{SEGMENT_DURATION}};
        const tl = gsap.timeline({ paused: true });

        tl.set({}, {}, SEGMENT_DURATION);
        window.__timelines = window.__timelines || {};
        window.__timelines['{{SEGMENT_ID}}'] = tl;
      })();
    </script>
  </div>
</template>
