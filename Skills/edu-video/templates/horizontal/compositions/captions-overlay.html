<template id="captions-overlay-template">
  <div
    id="captions-overlay"
    data-composition-id="captions-overlay"
    data-start="0"
    data-width="1920"
    data-height="1080"
    data-duration="{{TOTAL_DURATION}}"
  >
    <style>
      {{BRAND_CSS_VARS}}

      /* Bundled for HyperFrames Cloud — system/apt fonts are not on the cloud render path */
      @font-face {
        font-family: 'Noto Sans Kannada';
        src: url('assets/fonts/NotoSansKannada-Bold.woff2') format('woff2');
        font-weight: 700;
        font-style: normal;
        font-display: block;
      }

      #captions-overlay {
        position: relative;
        width: 1920px;
        height: 1080px;
        overflow: visible;
        background: transparent;
        pointer-events: none;
      }

      /* caption-highlight catalog patterns */
      #captions-overlay #hl-container {
        position: absolute;
        inset: 0;
        z-index: 10;
        pointer-events: none;
      }

      #captions-overlay .hl-group {
        position: absolute;
        bottom: 56px;
        left: 0;
        right: 0;
        width: 100%;
        max-width: 1400px;
        margin: 0 auto;
        display: flex;
        flex-wrap: nowrap;
        align-items: flex-end;
        justify-content: center;
        gap: 6px;
        padding: 0;
        font-size: 42px;
        line-height: 1.15;
        white-space: nowrap;
        opacity: 0;
        visibility: hidden;
      }

      #captions-overlay .hl-word {
        /* Inter for Latin; Noto Sans Kannada via @font-face for Indic glyphs */
        font-family: 'Inter', 'Noto Sans Kannada', system-ui, sans-serif;
        font-weight: 800;
        font-size: inherit;
        text-transform: uppercase;
        color: #ffffff;
        display: inline-block;
        letter-spacing: 0.02em;
        line-height: 1.15;
        position: relative;
        padding: 5px 10px 7px;
        text-shadow: 0 6px 18px rgba(0, 0, 0, 0.45);
        transform-origin: 50% 58%;
        will-change: transform, filter;
      }

      #captions-overlay .hl-word-bg {
        position: absolute;
        inset: 0;
        background: linear-gradient(
          135deg,
          var(--brand-accent, #fb923c) 0%,
          var(--brand-primary, #f97316) 100%
        );
        border-radius: 10px;
        box-shadow: 0 12px 30px rgba(0, 0, 0, 0.32);
        opacity: 0;
        transform: scaleX(0);
        transform-origin: 0% 50%;
        z-index: -1;
        transition: none;
      }

      #captions-overlay .hl-word.is-active .hl-word-bg {
        opacity: 1;
        transform: scaleX(1);
      }

      #captions-overlay .hl-word.is-spoken .hl-word-text {
        opacity: 0.88;
      }

      #captions-overlay .hl-word-text {
        position: relative;
        z-index: 1;
      }
    </style>

    <div id="hl-container"></div>

    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <script>
      (function () {
        window.__timelines = window.__timelines || {};

        var _fitCanvas = document.createElement('canvas');
        var _fitCtx = _fitCanvas.getContext('2d');
        function fitFontSize(text, baseFontSize, fontWeight, fontFamily, maxWidth) {
          var size = baseFontSize;
          var minSize = Math.floor(baseFontSize * 0.45);
          while (size > minSize) {
            _fitCtx.font = fontWeight + ' ' + size + 'px ' + fontFamily;
            if (_fitCtx.measureText(text).width <= maxWidth) return size;
            size -= 2;
          }
          return minSize;
        }

        var GROUPS = {{CAPTIONS_JSON}};
        var TOTAL_DURATION = {{TOTAL_DURATION}};
        var container = document.querySelector('#captions-overlay #hl-container');
        var brandFont = getComputedStyle(document.querySelector('#captions-overlay'))
          .getPropertyValue('--brand-font')
          .trim() || 'Inter, Noto Sans Kannada, system-ui, sans-serif';
        var tl = gsap.timeline({ paused: true });

        GROUPS.forEach(function (g, gi) {
          var words = g.words || [];
          if (!words.length) return;

          var grp = document.createElement('div');
          grp.className = 'clip hl-group';
          grp.id = 'hl-grp-' + gi;
          grp.setAttribute('data-start', String(g.start));
          grp.setAttribute('data-duration', String(Math.max(g.end - g.start, 0.01)));
          grp.setAttribute('data-track-index', '10');

          var groupText = words
            .map(function (w) {
              return String(w.text || '').toUpperCase();
            })
            .join(' ');
          var computedSize = fitFontSize(groupText, 42, '800', brandFont, 1400);

          words.forEach(function (w, wi) {
            var wordEl = document.createElement('span');
            wordEl.className = 'hl-word';
            wordEl.id = 'hl-w-' + gi + '-' + wi;
            wordEl.style.fontSize = computedSize + 'px';

            var bgEl = document.createElement('span');
            bgEl.className = 'hl-word-bg';
            bgEl.id = 'hl-bg-' + gi + '-' + wi;

            var textEl = document.createElement('span');
            textEl.className = 'hl-word-text';
            textEl.textContent = String(w.text || '').toUpperCase();

            wordEl.appendChild(bgEl);
            wordEl.appendChild(textEl);
            grp.appendChild(wordEl);
          });

          container.appendChild(grp);

          tl.set(grp, { visibility: 'visible' }, g.start);
          tl.fromTo(grp, { opacity: 0 }, { opacity: 1, duration: 0.12, ease: 'power2.out' }, g.start);

          // Seek-safe karaoke: exactly one active word — demote on NEXT word start, not w.end.
          // (Tweening bg at w.end overlaps the next word when timestamps are tight.)
          words.forEach(function (w, wi) {
            var wordEl = document.getElementById('hl-w-' + gi + '-' + wi);
            if (!wordEl) return;
            tl.set(wordEl, { className: 'hl-word' }, g.start);
          });

          words.forEach(function (w, wi) {
            var wordEl = document.getElementById('hl-w-' + gi + '-' + wi);
            if (!wordEl) return;
            var at = Math.max(g.start, Number(w.start));
            tl.set(wordEl, { className: 'hl-word is-active' }, at);
            if (wi + 1 < words.length) {
              var nextAt = Math.max(g.start, Number(words[wi + 1].start));
              tl.set(wordEl, { className: 'hl-word is-spoken' }, nextAt);
            }
          });

          if (words.length) {
            var lastIdx = words.length - 1;
            var lastEl = document.getElementById('hl-w-' + gi + '-' + lastIdx);
            var lastSpoken = Math.min(g.end, Number(words[lastIdx].end) + 0.05);
            if (lastEl) tl.set(lastEl, { className: 'hl-word is-spoken' }, lastSpoken);
          }

          tl.to(grp, { opacity: 0, duration: 0.1, ease: 'power2.in' }, g.end - 0.1);
          tl.set(grp, { opacity: 0, visibility: 'hidden' }, g.end);
        });

        tl.set({}, {}, TOTAL_DURATION);
        tl.seek(0);
        window.__timelines['captions-overlay'] = tl;
      })();
    </script>
  </div>
</template>
