<template id="seg-mode-c-template">
  <div
    id="{{SEGMENT_ID}}"
    data-composition-id="{{SEGMENT_ID}}"
    data-start="0"
    data-width="1920"
    data-height="1080"
    data-duration="{{SEGMENT_DURATION}}"
  >
    <div id="brand-bg"></div>
    <div id="speaker-float"></div>

    <style>
      {{BRAND_CSS_VARS}}

      #{{SEGMENT_ID}} {
        position: relative;
        width: 1920px;
        height: 1080px;
        overflow: hidden;
      }

      #{{SEGMENT_ID}} #brand-bg {
        position: absolute;
        inset: 0;
        z-index: 0;
        background: linear-gradient(
          135deg,
          var(--brand-bg-dark, #0a0a0a) 0%,
          var(--brand-primary, #f97316) 45%,
          var(--brand-secondary, var(--brand-primary, #f97316)) 100%
        );
      }

      #{{SEGMENT_ID}} #speaker-float {
        position: absolute;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        width: 65%;
        aspect-ratio: 16 / 9;
        border-radius: 24px;
        overflow: hidden;
        box-shadow:
          0 16px 48px rgba(0, 0, 0, 0.5),
          inset 0 1px 0 rgba(255, 255, 255, 0.15);
        border: 1px solid rgba(255, 255, 255, 0.2);
        z-index: 1;
        pointer-events: none;
      }
    </style>

    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <script>
      (function () {
        const SEGMENT_DURATION = {{SEGMENT_DURATION}};
        const tl = gsap.timeline({ paused: true });

        {{MODE_GSAP}}

        tl.set({}, {}, SEGMENT_DURATION);
        window.__timelines = window.__timelines || {};
        window.__timelines['{{SEGMENT_ID}}'] = tl;
      })();
    </script>
  </div>
</template>
