<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=1920, height=1080" />
  <link rel="stylesheet" href="assets/brand-tokens.css" />
  <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
  <script src="lib/liquid-glass.iife.js"></script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { width: 1920px; height: 1080px; overflow: hidden; background: #000; }
    #stage {
      position: relative;
      width: 1920px;
      height: 1080px;
      overflow: hidden;
      background: #000;
    }
    #glass-canvas {
      position: absolute;
      top: 0;
      left: 0;
      width: 1920px;
      height: 1080px;
      z-index: 6;
      pointer-events: none;
    }
    #manim-stage {
      position: absolute;
      inset: 0;
      z-index: 2;
      pointer-events: none;
    }
    #manim-stage video {
      position: absolute;
      inset: 0;
      width: 1920px;
      height: 1080px;
      object-fit: contain;
      display: block;
      background: transparent;
    }
    #speaker-wrap {
      position: absolute;
      top: 68px;
      left: 120px;
      width: 1680px;
      height: 945px;
      border-radius: 22px;
      z-index: 3;
      overflow: hidden;
    }
    #speaker-wrap.glass-panel {
      background: rgba(255, 255, 255, 0.025);
      --lg-blur: 0.42;
      --lg-refraction: 0.82;
      --lg-corner-radius: 18;
      --lg-z-radius: 36;
      --lg-specular: 0.34;
      --lg-fresnel: 1.25;
      --lg-edge-highlight: 0.26;
      --lg-chrom-aberration: 0.08;
      --lg-shadow-opacity: 0.35;
      --lg-shadow-spread: 12;
      --lg-shadow-offset-y: 8;
      --lg-saturation: 0.38;
      border: 1px solid rgba(255, 255, 255, 0.18);
      box-shadow:
        0 8px 32px rgba(0, 0, 0, 0.45),
        inset 0 1px 0 rgba(255, 255, 255, 0.15);
    }
    #speaker-wrap video {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }
  </style>
</head>
<body>
  <div
    id="stage"
    data-composition-id="root"
    data-start="0"
    data-duration="{{TOTAL_DURATION}}"
    data-width="1920"
    data-height="1080"
  >
    <audio
      id="audio-master"
      class="clip"
      data-start="0"
      data-duration="{{TOTAL_DURATION}}"
      data-track-index="20"
      data-volume="1.0"
      src="assets/audio.mp3"
    ></audio>

    {{SEGMENT_WIRING}}

    {{TRANSITION_WIRING}}

    <div id="manim-stage">
      {{MANIM_CLIPS}}
    </div>

    <div id="speaker-wrap" class="liquid-glass">
      <video
        id="speaker-main"
        class="clip"
        data-start="0"
        data-duration="{{TOTAL_DURATION}}"
        data-track-index="3"
        src="assets/speaker_noaudio.mp4"
        muted
        playsinline
      ></video>
    </div>

    <canvas id="glass-canvas" width="1920" height="1080"></canvas>

    <div
      id="captions"
      data-composition-id="captions-overlay"
      data-composition-src="compositions/captions-overlay.html"
      data-start="0"
      data-duration="{{TOTAL_DURATION}}"
      data-track-index="5"
      data-width="1920"
      data-height="1080"
    ></div>
  </div>

  <script>
    window.__timelines = window.__timelines || {};
    const tl = gsap.timeline({ paused: true });

    const FS = { top: 68, left: 120, xPercent: 0, yPercent: 0, width: 1680, height: 945, borderRadius: 22 };
    // shell: bottom 64 + right 24 → top = 1080-64-237, left = 1920-24-422
    const PIP_MANIM = { top: 779, left: 1474, xPercent: 0, yPercent: 0, width: 422, height: 237, borderRadius: 18 };
    const PIP_VIZ = { top: 160, left: 1500, xPercent: 0, yPercent: 0, width: 380, height: 214, borderRadius: 18 };

    /* {{SPEAKER_GSAP}} — stamp at Gate 2, e.g.:
       tl.set('#speaker-wrap', FS, 0);
       tl.to('#speaker-wrap', { ...PIP_MANIM, duration: 0.35, ease: 'power2.inOut' }, <modeA_or_modeB_start>);
       tl.to('#speaker-wrap', { ...FS, duration: 0.35, ease: 'power2.inOut' }, <segment_end>);
       During PiP segments: add class 'glass-panel' to #speaker-wrap via tl.set or className tween */
    {{SPEAKER_GSAP}}

    /* MANIM_GSAP below is stamped by scaffold_hf_project: root-timeline
       show/hide for each manim clip during its Mode A segment */
    {{MANIM_GSAP}}

    {{LIQUID_GLASS_INIT}}

    window.__timelines['root'] = tl;
  </script>
</body>
</html>
